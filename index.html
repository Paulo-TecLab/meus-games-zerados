<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Beaten Games | Archive</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
    <div class="overlay"></div>
    <main class="container">
        <header>
            <h1>O Arquivo das Almas</h1>
            <p>Registros de Jogos Zerados</p>
        </header>

        <section class="game-form">
            <form id="beaten-game-form">
                <div class="input-group">
                    <input type="text" id="game-title" placeholder="Nome do Jogo" required>
                    <input type="text" id="game-genre" placeholder="Gênero (Ex: RPG, Souls-like)" required>
                </div>
                <div class="input-group">
                    <select id="game-tier">
                        <option value="" disabled selected>Dificuldade</option>
                        <option value="Casual">Casual</option>
                        <option value="Médio">Médio</option>
                        <option value="Difícil">Difícil</option>
                        <option value="Insuportável">Insuportável</option>
                    </select>
                    <input type="number" id="game-rating" placeholder="Nota (0-10)" min="0" max="10" step="0.1" required>
                    <input type="number" id="game-hours" placeholder="Horas Jogadas" required>
                </div>
                <div class="input-group">
                    <label for="start-date">Início:</label>
                    <input type="date" id="start-date" required>
                    <label for="end-date">Fim:</label>
                    <input type="date" id="end-date" required>
                </div>
                <button type="submit" id="add-btn">Registrar no Abismo</button>
            </form>
        </section>

        <section class="list-container">
            <h2>Jogos Conquistados</h2>
            <div id="games-list" class="games-grid"></div>
        </section>
    </main>

    <!-- CONFIGURAÇÃO DO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // COLOQUE SEUS DADOS DO FIREBASE AQUI ABAIXO
        const firebaseConfig = {
            apiKey: "AIzaSyAmh0qx7B5oPmeMZtglIX6va4-5tMMldYE",
            authDomain: "meus-games-zerados.firebaseapp.com",
            databaseURL: "https://meus-games-zerados-default-rtdb.firebaseio.com",
            projectId: "meus-games-zerados",
            storageBucket: "meus-games-zerados.firebasestorage.app",
            messagingSenderId: "984959183856",
            appId: "1:984959183856:web:1dcb4088a5bc8093244b35",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Exportando para o script.js
        window.db = db;
        window.dbRef = ref;
        window.dbPush = push;
        window.dbOnValue = onValue;
        window.dbRemove = remove;
    </script>

    <script src="script.js"></script>
</body>
</html>
